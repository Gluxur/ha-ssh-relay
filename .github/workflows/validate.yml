name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    # HACS cannot read a private repository. The event payload says whether the
    # repo is private, except on schedule (no repository in the payload): there
    # the repository variable REPO_PUBLIC=true opts in once the repo is public.
    if: ${{ (github.event.repository && !github.event.repository.private) || vars.REPO_PUBLIC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y jq
      - run: pip install -r requirements_test.txt
      - run: pytest

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck relay/relay-setup.sh
      - run: shellcheck -x tests/integration/sshd_check.sh

  sshd:
    name: Real sshd and nginx (Ubuntu 22.04)
    runs-on: ubuntu-latest
    # Same OpenSSH (8.9) and nginx as the relay VM image.
    container: ubuntu:22.04 # zizmor: ignore[unpinned-images] -- track 22.04 security updates, like the relay VM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server jq nginx libnginx-mod-stream
      - run: bash tests/integration/sshd_check.sh

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive relay/oracle
      - run: terraform -chdir=relay/oracle init -backend=false
      - run: terraform -chdir=relay/oracle validate
